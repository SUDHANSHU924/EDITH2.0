version: '3.8'

services:
  nim-claude:
    image: nvcr.io/nim/meta/llama-3.1-405b-instruct:latest
    container_name: edith-nim-claude
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NIM_MODEL_PROFILE=${NIM_MODEL_PROFILE}
    volumes:
      - nim-cache:/opt/nim/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  nim-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /tmp/nim-cache
